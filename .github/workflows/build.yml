              private fun applyModes(player: ExoPlayer) {
                  val autoplay = sp.getBoolean("autoplay", true)
                  val repeat = sp.getBoolean("repeat", false)
                  player.setPauseAtEndOfMediaItems(!autoplay)
                  player.repeatMode =
                      if (repeat && autoplay) Player.REPEAT_MODE_ALL else Player.REPEAT_MODE_OFF
              }

