                                                  lp.screenBrightness = brightness
                                                  activity.window.attributes = lp
                                                  showHud("Yorqinlik ${(brightness * 100).roundToInt()}%")
                                              } else {
                                                  volF = (volF + d * maxVol).coerceIn(0f, maxVol.toFloat())
                                                  audio.setStreamVolume(
                                                      AudioManager.STREAM_MUSIC, volF.roundToInt(), 0
                                                  )
                                                  showHud("Ovoz ${volF.roundToInt()}/$maxVol")
                                              }
                                          }
                                      }
                                  )
                              }
                      )

                      if (controlsVisible && !locked) {
                          Box(
                              Modifier
                                  .fillMaxSize()
                                  .displayCutoutPadding()
                                  .padding(horizontal = 16.dp, vertical = 12.dp)
                          ) {
