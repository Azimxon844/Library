                                          DropdownMenuItem(
                                              text = { Text("Tafsilotlar") },
                                              onClick = { menuOpen = false; detailsDialog = true }
                                          )
                                          DropdownMenuItem(
                                              text = { Text("Parametrlar") },
                                              onClick = { menuOpen = false; settingsDialog = true }
                                          )
                                      }
                                  }
                              }

                              // Markaz: oldingi / ijro / keyingi
                              Row(
                                  Modifier.align(Alignment.Center),
                                  horizontalArrangement = Arrangement.spacedBy(36.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  RoundBtn(Icons.Filled.SkipPrevious, 52.dp, hasPrev) {
                                      touchTick++
                                      exo.seekToPreviousMediaItem()
                                  }
                                  RoundBtn(if (isPlaying) Icons.Filled.Pause else Icons.Filled.PlayArrow, 72.dp) {
                                      touchTick++
                                      togglePlay()
                                  }
                                  RoundBtn(Icons.Filled.SkipNext, 52.dp, hasNext) {
                                      touchTick++
                                      exo.seekToNextMediaItem()
                                  }
                              }

                              // Pastki qism: vaqt, surgich, tugmalar
                              Column(
                                  Modifier.align(Alignment.BottomCenter).fillMaxWidth(),
                                  horizontalAlignment = Alignment.CenterHorizontally
                              ) {
                                  val frac = if (duration > 0)
                                      (seeking ?: (position.toFloat() / duration)).coerceIn(0f, 1f)
                                  else 0f
                                  val shownPos = if (seeking != null) (frac * duration).toLong() else position
                                  Row(
                                      Modifier.fillMaxWidth().padding(horizontal = 8.dp),
                                      horizontalArrangement = Arrangement.SpaceBetween
                                  ) {
                                      Text(
                                          formatDuration(shownPos),
                                          color = Color.White,
                                          style = MaterialTheme.typography.bodySmall
                                      )
                                      Text(
                                          formatDuration(duration),
                                          color = Color.White,
                                          style = MaterialTheme.typography.bodySmall
                                      )
                                  }
                                  Slider(
                                      value = frac,
                                      onValueChange = { seeking = it; touchTick++ },
                                      onValueChangeFinished = {
                                          seeking?.let { f ->
                                              if (duration > 0) exo.seekTo((f * duration).toLong())
                                          }
                                          seeking = null
                                      },
                                      colors = SliderDefaults.colors(
                                          thumbColor = Color.White,
                                          activeTrackColor = Color.White,
                                          inactiveTrackColor = Color(0x55FFFFFF)
                                      )
                                  )
                                  Row(
                                      Modifier
                                          .clip(RoundedCornerShape(28.dp))
                                          .background(PILL)
                                          .padding(horizontal = 8.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      IconButton(onClick = {
                                          touchTick++
                                          resizeIdx = (resizeIdx + 1) % RESIZE_MODES.size
                                          showHud(RESIZE_NAMES[resizeIdx])
                                      }) { Icon(Icons.Filled.AspectRatio, "O'lcham", tint = Color.White) }
                                      IconButton(onClick = { touchTick++; speedDialog = true }) {
                                          Icon(Icons.Filled.Speed, "Tezlik", tint = Color.White)
                                      }
                                      IconButton(onClick = { touchTick++; activity.toggleOrientation() }) {
                                          Icon(Icons.Filled.ScreenRotation, "Aylantirish", tint = Color.White)
                                      }
                                      IconButton(onClick = { activity.startPopup() }) {
                                          Icon(
                                              Icons.Filled.PictureInPictureAlt,
                                              "Qalqib chiquvchi oyna",
                                              tint = Color.White
                                          )
                                      }
                                      IconButton(onClick = { locked = true; controlsVisible = false }) {
                                          Icon(Icons.Filled.Lock, "Qulflash", tint = Color.White)
                                      }
                                  }
                              }
                          }
                      }

                      // Qulflangan holat: faqat qulfni ochish tugmasi
                      if (locked && controlsVisible) {
                          Box(Modifier.fillMaxSize().displayCutoutPadding().padding(24.dp)) {
                              RoundBtn(Icons.Filled.Lock, 56.dp) { locked = false; touchTick++ }
                          }
                      }

                      hud?.let {
                          Text(
                              it,
                              color = Color.White,
                              modifier = Modifier
                                  .align(Alignment.TopCenter)
                                  .padding(top = 72.dp)
                                  .clip(RoundedCornerShape(20.dp))
                                  .background(Color(0xAA000000))
                                  .padding(horizontal = 16.dp, vertical = 8.dp)
                          )
                      }
                  }
              }

              if (speedDialog) {
                  AlertDialog(
                      onDismissRequest = { speedDialog = false },
                      title = { Text("Ijro tezligi") },
                      text = {
                          Column {
                              SPEEDS.forEach { s ->
                                  Row(
                                      Modifier
                                          .fillMaxWidth()
                                          .clickable {
                                              speed = s
                                              exo.setPlaybackSpeed(s)
                                              speedDialog = false
                                              showHud("${s}x")
                                          }
                                          .padding(vertical = 8.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      RadioButton(selected = speed == s, onClick = null)
                                      Spacer(Modifier.width(10.dp))
                                      Text("${s}x")
                                  }
                              }
                          }
                      },
                      confirmButton = { TextButton(onClick = { speedDialog = false }) { Text("Yopish") } }
                  )
              }

              if (settingsDialog) {
                  AlertDialog(
                      onDismissRequest = { settingsDialog = false },
                      title = { Text("Video pleyer parametrlari") },
                      text = {
                          Column {
                              SwitchRow("Keyingi videoni avto-qo'yish", autoplay) {
                                  autoplay = it
                                  sp.edit().putBoolean("autoplay", it).apply()
                                  applyModes()
                              }
                              SwitchRow("Videolarni avtomatik takrorlash", repeat, enabled = autoplay) {
                                  repeat = it
                                  sp.edit().putBoolean("repeat", it).apply()
                                  applyModes()
                              }
                              SwitchRow("Fonda o'ynatish (ekran o'chganda ham ovoz)", bgplay) {
                                  bgplay = it
                                  sp.edit().putBoolean("bgplay", it).apply()
                              }
                          }
                      },
                      confirmButton = { TextButton(onClick = { settingsDialog = false }) { Text("Yopish") } }
                  )
              }

              if (detailsDialog) {
                  val vs = exo.videoSize
                  AlertDialog(
                      onDismissRequest = { detailsDialog = false },
                      title = { Text("Tafsilotlar") },
                      text = {
                          Column {
                              InfoLine("Nomi", title)
                              InfoLine("Davomiyligi", formatDuration(duration))
                              if (vs.width > 0 && vs.height > 0) InfoLine("O'lchami", "${vs.width} × ${vs.height}")
                              InfoLine("Manzil", exo.currentMediaItem?.localConfiguration?.uri?.toString() ?: "")
                          }
                      },
                      confirmButton = { TextButton(onClick = { detailsDialog = false }) { Text("Yopish") } }
                  )
              }
          }
          EOF_FILE
          mkdir -p $(dirname 'app/src/main/java/uz/videokutubxona/PlayerCore.kt')
          cat > 'app/src/main/java/uz/videokutubxona/PlayerCore.kt' <<'EOF_FILE'
          package uz.videokutubxona

          import android.annotation.SuppressLint
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.ScaleGestureDetector
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.ImageButton
          import android.widget.LinearLayout
          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.common.Player
          import androidx.media3.common.VideoSize
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService
          import androidx.media3.ui.PlayerView
          import kotlin.math.abs

          /** Butun ilova uchun bitta pleyer: ekran, xizmat va qalqib chiquvchi oyna shuni bo'lishadi. */
          object PlayerHolder {
              private var player: ExoPlayer? = null
              private var appCtx: Context? = null

              fun get(ctx: Context): ExoPlayer {
                  player?.let { return it }
                  val app = ctx.applicationContext
                  appCtx = app
                  val p = ExoPlayer.Builder(app)
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setContentType(C.AUDIO_CONTENT_TYPE_MOVIE)
                              .setUsage(C.USAGE_MEDIA)
                              .build(),
                          true
                      )
                      .setHandleAudioBecomingNoisy(true)
                      .setWakeMode(C.WAKE_MODE_LOCAL)
                      .build()
                  p.addListener(object : Player.Listener {
                      override fun onPositionDiscontinuity(
                          oldPosition: Player.PositionInfo,
                          newPosition: Player.PositionInfo,
                          reason: Int
                      ) {
                          if (oldPosition.mediaItemIndex != newPosition.mediaItemIndex) {
                              store(app, oldPosition.mediaItemIndex, oldPosition.positionMs)
                          }
                      }

                      override fun onIsPlayingChanged(isPlaying: Boolean) {
                          if (!isPlaying) saveCurrent()
                      }
                  })
                  player = p
                  return p
              }

              fun store(ctx: Context, index: Int, posMs: Long) {
                  val id = PlayQueue.ids.getOrNull(index) ?: return
                  val dur = PlayQueue.durations.getOrElse(index) { 0L }
                  val e = ctx.getSharedPreferences("prefs", Context.MODE_PRIVATE).edit()
                  if (dur > 0 && posMs > 5_000 && posMs < dur - 10_000) e.putLong("pos_$id", posMs)
                  else e.remove("pos_$id")
                  e.apply()
              }

              fun saveCurrent() {
                  val p = player ?: return
                  val c = appCtx ?: return
                  if (p.mediaItemCount == 0) return
                  store(c, p.currentMediaItemIndex, p.currentPosition)
              }

              fun setVideoEnabled(enabled: Boolean) {
                  val p = player ?: return
                  p.trackSelectionParameters = p.trackSelectionParameters.buildUpon()
                      .setTrackTypeDisabled(C.TRACK_TYPE_VIDEO, !enabled)
                      .build()
              }

              fun stopAll(ctx: Context) {
                  saveCurrent()
                  player?.let {
                      it.stop()
                      it.clearMediaItems()
                  }
                  ctx.stopService(Intent(ctx, PlaybackService::class.java))
              }
          }

          /** Ekran o'chganda ham ovoz davom etishi uchun: bildirishnoma + media sessiya. */
          class PlaybackService : MediaSessionService() {
              private var session: MediaSession? = null

              override fun onCreate() {
                  super.onCreate()
                  val player = PlayerHolder.get(applicationContext)
                  val open = PendingIntent.getActivity(
                      this, 0,
                      Intent(this, PlayerActivity::class.java).putExtra("resume", true),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  session = MediaSession.Builder(this, player).setSessionActivity(open).build()
              }

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? = session

              override fun onTaskRemoved(rootIntent: Intent?) {
                  val p = session?.player
                  if (p == null || !p.playWhenReady || p.mediaItemCount == 0) stopSelf()
              }

              override fun onDestroy() {
                  session?.release()
                  session = null
                  super.onDestroy()
              }
          }

          /** Boshqa ilovalar ustida qalqib chiquvchi video oyna (surish va ikki barmoq bilan kattalashtirish mumkin). */
          class PopupService : Service() {
              private var wm: WindowManager? = null
              private var root: FrameLayout? = null
              private var pv: PlayerView? = null
              private var listener: Player.Listener? = null
              private val handler = Handler(Looper.getMainLooper())

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (root == null) {
                      if (!Settings.canDrawOverlays(this)) {
                          stopSelf()
                          return START_NOT_STICKY
                      }
                      show()
                  }
                  return START_NOT_STICKY
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun show() {
                  val exo = PlayerHolder.get(applicationContext)
                  PlayerHolder.setVideoEnabled(true)
                  val manager = getSystemService(WINDOW_SERVICE) as WindowManager
                  wm = manager

                  val dm = resources.displayMetrics
                  val d = dm.density
                  val minW = (dm.widthPixels * 0.35f).toInt()
                  val maxW = (dm.widthPixels * 0.95f).toInt()
                  val w0 = (dm.widthPixels * 0.6f).toInt()
                  val params = WindowManager.LayoutParams(
                      w0,
                      (w0 * 9f / 16f).toInt(),
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.TOP or Gravity.START
                  params.x = dm.widthPixels / 5
                  params.y = dm.heightPixels / 6

                  val frame = FrameLayout(this)
                  frame.setBackgroundColor(0xFF000000.toInt())

                  val view = PlayerView(this)
                  view.useController = false
                  view.player = exo
                  frame.addView(
                      view,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )

                  val ctl = FrameLayout(this)
                  frame.addView(
                      ctl,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )

                  val hide = Runnable { ctl.visibility = View.GONE }
                  fun schedule() {
                      handler.removeCallbacksAndMessages(null)
                      handler.postDelayed(hide, 3000)
                  }

                  val size = (40 * d).toInt()
                  val margin = (4 * d).toInt()
                  fun makeBtn(res: Int, action: () -> Unit): ImageButton {
                      val b = ImageButton(this)
                      b.setImageResource(res)
                      b.setBackgroundColor(0x66000000)
                      b.setOnClickListener {
                          action()
                          schedule()
                      }
                      return b
                  }

                  val prev = makeBtn(android.R.drawable.ic_media_previous) { exo.seekToPreviousMediaItem() }
                  val play = makeBtn(android.R.drawable.ic_media_play) {
                      if (exo.isPlaying) exo.pause() else exo.play()
                  }
                  val next = makeBtn(android.R.drawable.ic_media_next) { exo.seekToNextMediaItem() }
                  val expand = makeBtn(android.R.drawable.ic_menu_zoom) { openFull() }
                  val close = makeBtn(android.R.drawable.ic_menu_close_clear_cancel) { closeAll() }

                  val bottom = LinearLayout(this)
                  bottom.orientation = LinearLayout.HORIZONTAL
                  for (b in listOf(prev, play, next)) {
                      val lpb = LinearLayout.LayoutParams(size, size)
                      lpb.setMargins(margin, margin, margin, margin)
                      bottom.addView(b, lpb)
                  }
                  ctl.addView(
                      bottom,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
                      )
                  )

                  val top = LinearLayout(this)
                  top.orientation = LinearLayout.HORIZONTAL
                  for (b in listOf(expand, close)) {
                      val lpt = LinearLayout.LayoutParams(size, size)
                      lpt.setMargins(margin, margin, margin, margin)
                      top.addView(b, lpt)
                  }
                  ctl.addView(
                      top,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP or Gravity.END
                      )
                  )

                  fun refreshPlay() {
                      play.setImageResource(
                          if (exo.isPlaying) android.R.drawable.ic_media_pause
                          else android.R.drawable.ic_media_play
                      )
                  }
                  refreshPlay()

                  fun applyAspect(vs: VideoSize) {
                      if (vs.width > 0 && vs.height > 0) {
                          val r = vs.height.toFloat() / vs.width
                          params.height = (params.width * r).toInt()
                          try {
                              manager.updateViewLayout(frame, params)
                          } catch (e: Exception) {
                          }
                      }
                  }
                  applyAspect(exo.videoSize)

                  val l = object : Player.Listener {
                      override fun onIsPlayingChanged(isPlaying: Boolean) {
                          refreshPlay()
                      }

                      override fun onVideoSizeChanged(videoSize: VideoSize) {
                          applyAspect(videoSize)
                      }
                  }
                  exo.addListener(l)
                  listener = l

                  // Surish, bir marta bosish (boshqaruvni ko'rsatish), ikki barmoq bilan kattalashtirish
                  val sgd = ScaleGestureDetector(
                      this,
                      object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                          override fun onScale(detector: ScaleGestureDetector): Boolean {
                              val ratio = params.height.toFloat() / params.width
                              val nw = (params.width * detector.scaleFactor).toInt().coerceIn(minW, maxW)
                              params.width = nw
                              params.height = (nw * ratio).toInt()
                              try {
                                  manager.updateViewLayout(frame, params)
                              } catch (e: Exception) {
                              }
                              return true
                          }
                      }
                  )
                  var sx = 0
                  var sy = 0
                  var tx = 0f
                  var ty = 0f
                  var moved = false
                  frame.setOnTouchListener { _, e ->
                      sgd.onTouchEvent(e)
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              sx = params.x
                              sy = params.y
                              tx = e.rawX
                              ty = e.rawY
                              moved = false
                          }
                          MotionEvent.ACTION_POINTER_UP -> {
                              sx = params.x
                              sy = params.y
                              tx = e.rawX
                              ty = e.rawY
                              moved = true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              if (!sgd.isInProgress && e.pointerCount == 1) {
                                  val dx = e.rawX - tx
                                  val dy = e.rawY - ty
                                  if (abs(dx) > 8 || abs(dy) > 8) moved = true
                                  if (moved) {
                                      params.x = sx + dx.toInt()
                                      params.y = sy + dy.toInt()
                                      try {
                                          manager.updateViewLayout(frame, params)
                                      } catch (ex: Exception) {
                                      }
                                  }
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved) {
                                  if (ctl.visibility == View.VISIBLE) {
                                      ctl.visibility = View.GONE
                                  } else {
                                      ctl.visibility = View.VISIBLE
                                      schedule()
                                  }
                              }
                          }
                      }
                      true
                  }

                  manager.addView(frame, params)
                  root = frame
                  pv = view
                  schedule()
              }

              private fun openFull() {
                  val i = Intent(this, PlayerActivity::class.java)
                      .putExtra("resume", true)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  startActivity(i)
                  stopSelf()
              }

              private fun closeAll() {
                  PlayerHolder.stopAll(applicationContext)
                  stopSelf()
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  listener?.let { PlayerHolder.get(applicationContext).removeListener(it) }
                  listener = null
                  pv?.player = null
                  pv = null
                  root?.let {
                      try {
                          wm?.removeView(it)
                      } catch (e: Exception) {
                      }
                  }
                  root = null
                  super.onDestroy()
              }
          }
          EOF_FILE
          mkdir -p $(dirname 'app/src/main/res/values-night/themes.xml')
          cat > 'app/src/main/res/values-night/themes.xml' <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.VideoKutubxona" parent="android:Theme.Material.NoActionBar" />
          </resources>
          EOF_FILE
          mkdir -p $(dirname 'app/src/main/res/values/themes.xml')
          cat > 'app/src/main/res/values/themes.xml' <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.VideoKutubxona" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF_FILE
          mkdir -p $(dirname 'build.gradle.kts')
          cat > 'build.gradle.kts' <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF_FILE
          mkdir -p $(dirname 'gradle.properties')
          cat > 'gradle.properties' <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_FILE
          mkdir -p $(dirname 'gradle/wrapper/gradle-wrapper.properties')
          cat > 'gradle/wrapper/gradle-wrapper.properties' <<'EOF_FILE'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF_FILE
          mkdir -p $(dirname 'settings.gradle.kts')
          cat > 'settings.gradle.kts' <<'EOF_FILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "VideoKutubxona"
          include(":app")
          EOF_FILE
      - name: Build
        working-directory: VideoKutubxona
        run: gradle assembleDebug --no-daemon
      - name: Verify APK
        run: |
          APK=VideoKutubxona/app/build/outputs/apk/debug/app-debug.apk
          ls -l $APK
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --verbose --print-certs $APK || true
          $BT/aapt dump badging $APK | head -8 || true
      - name: Rename APK
        run: cp VideoKutubxona/app/build/outputs/apk/debug/app-debug.apk VideoKutubxona.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Video Kutubxona (build ${{ github.run_number }})
          files: VideoKutubxona.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VideoKutubxona-apk
          path: VideoKutubxona.apk
