              /** Tizimning "rasm ichida rasm" oynasi. */
              fun enterPip() {
                  if (!packageManager.hasSystemFeature(PackageManager.FEATURE_PICTURE_IN_PICTURE)) return
                  val vs = exo.videoSize
                  val r = if (vs.width > 0 && vs.height > 0) vs.width.toFloat() / vs.height else 16f / 9f
                  val rc = r.coerceIn(0.45f, 2.2f)
                  try {
                      enterPictureInPictureMode(
                          PictureInPictureParams.Builder()
                              .setAspectRatio(Rational((rc * 1000).toInt(), 1000))
                              .build()
                      )
                  } catch (e: Exception) {
                      Toast.makeText(this, "Bu rejim hozir ishlamaydi", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onPictureInPictureModeChanged(
                  isInPictureInPictureMode: Boolean,
                  newConfig: Configuration
              ) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig)
                  pipActive = isInPictureInPictureMode
              }

              private fun displayName(uri: Uri): String {
                  return try {
                      contentResolver.query(uri, null, null, null, null)?.use { c ->
                          val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (i >= 0 && c.moveToFirst()) c.getString(i) else null
                      } ?: ""
                  } catch (e: Exception) {
                      ""
                  }
              }

              private fun addSubtitle(uri: Uri) {
                  val player = exo
                  val cur = player.currentMediaItem ?: return
                  val idx = player.currentMediaItemIndex
                  val pos = player.currentPosition
                  val n = displayName(uri).lowercase()
                  val mime = when {
                      n.endsWith(".vtt") -> "text/vtt"
                      n.endsWith(".ass") || n.endsWith(".ssa") -> "text/x-ssa"
                      else -> "application/x-subrip"
                  }
                  val sub = MediaItem.SubtitleConfiguration.Builder(uri)
                      .setMimeType(mime)
                      .setLanguage("und")
                      .setSelectionFlags(C.SELECTION_FLAG_DEFAULT)
                      .build()
                  player.replaceMediaItem(idx, cur.buildUpon().setSubtitleConfigurations(listOf(sub)).build())
                  player.seekTo(idx, pos)
                  player.play()
              }

              override fun onStart() {
                  super.onStart()
                  PlayerHolder.setVideoEnabled(true)
              }

              override fun onStop() {
                  super.onStop()
                  PlayerHolder.saveCurrent()
                  if (isInPictureInPictureMode) {
                      // PiP oynasi yopildi
                      finish()
                      return
                  }
                  if (handOff || isFinishing) return
                  if (sp.getBoolean("bgplay", true)) {
                      // Ekran o'chganda yoki ilova orqada: faqat ovoz davom etadi
                      PlayerHolder.setVideoEnabled(false)
                  } else {
                      exo.pause()
                  }
              }

              override fun onDestroy() {
                  if (current === this) current = null
                  if (isFinishing && !handOff) {
                      PlayerHolder.stopAll(applicationContext)
                  }
                  super.onDestroy()
              }
          }

