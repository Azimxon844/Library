              var menuOpen by remember { mutableStateOf(false) }
              var speedDialog by remember { mutableStateOf(false) }
              var settingsDialog by remember { mutableStateOf(false) }
              var detailsDialog by remember { mutableStateOf(false) }

              var autoplay by remember { mutableStateOf(sp.getBoolean("autoplay", true)) }
              var repeat by remember { mutableStateOf(sp.getBoolean("repeat", false)) }
              var bgplay by remember { mutableStateOf(sp.getBoolean("bgplay", true)) }

              val inPip = activity.pipActive

              var hud by remember { mutableStateOf<String?>(null) }
              var hudTick by remember { mutableIntStateOf(0) }
              fun showHud(s: String) {
                  hud = s
                  hudTick++
              }

              val audio = remember { activity.getSystemService(Context.AUDIO_SERVICE) as AudioManager }
              val maxVol = remember { audio.getStreamMaxVolume(AudioManager.STREAM_MUSIC) }
              var volF by remember { mutableFloatStateOf(audio.getStreamVolume(AudioManager.STREAM_MUSIC).toFloat()) }
              var brightness by remember { mutableFloatStateOf(initialBrightness(activity)) }

              val pvRef = remember { mutableStateOf<PlayerView?>(null) }
              DisposableEffect(exo) {
                  onDispose { pvRef.value?.player = null }
              }

              DisposableEffect(exo) {
                  val l = object : Player.Listener {
                      override fun onEvents(player: Player, events: Player.Events) {
                          isPlaying = player.isPlaying
                          title = PlayQueue.names.getOrNull(player.currentMediaItemIndex) ?: ""
                          hasPrev = player.hasPreviousMediaItem()
                          hasNext = player.hasNextMediaItem()
                          if (player.duration > 0) duration = player.duration
                      }
                  }
                  exo.addListener(l)
                  onDispose { exo.removeListener(l) }
              }

              LaunchedEffect(exo) {
                  while (true) {
                      position = exo.currentPosition
                      if (exo.duration > 0) duration = exo.duration
                      delay(300)
                  }
              }

              LaunchedEffect(controlsVisible, isPlaying, touchTick) {
                  if (controlsVisible && isPlaying) {
                      delay(4000)
                      controlsVisible = false
                  }
              }

              LaunchedEffect(hudTick) {
                  if (hudTick > 0) {
                      delay(900)
                      hud = null
                  }
              }

              fun togglePlay() {
                  if (exo.playbackState == Player.STATE_ENDED) exo.seekTo(0)
                  if (exo.isPlaying) exo.pause() else exo.play()
              }

              fun applyModes() {
                  exo.setPauseAtEndOfMediaItems(!autoplay)
                  exo.repeatMode = if (repeat && autoplay) Player.REPEAT_MODE_ALL else Player.REPEAT_MODE_OFF
              }

              Box(Modifier.fillMaxSize().background(Color.Black)) {
                  AndroidView(
                      modifier = Modifier.fillMaxSize(),
                      factory = { ctx ->
                          PlayerView(ctx).apply {
                              player = exo
                              useController = false
                              pvRef.value = this
                          }
                      },
                      update = { it.resizeMode = RESIZE_MODES[resizeIdx] }
                  )

                  if (!inPip) {
                      if (controlsVisible && !locked) {
                          Box(Modifier.fillMaxSize().background(Color(0x66000000)))
                      }

                      // Ishoralar qatlami: bir marta bosish, ikki marta bosish, yorqinlik/ovoz
                      Box(
                          Modifier
                              .fillMaxSize()
                              .pointerInput(locked) {
                                  detectTapGestures(
                                      onTap = {
                                          controlsVisible = !controlsVisible
                                          touchTick++
                                      },
                                      onDoubleTap = { off ->
                                          if (!locked) {
                                              val w = size.width
                                              if (off.x < w / 3f) {
                                                  exo.seekTo((exo.currentPosition - 10_000).coerceAtLeast(0L))
                                                  showHud("-10 s")
                                              } else if (off.x > w * 2f / 3f) {
                                                  val t = exo.currentPosition + 10_000
                                                  exo.seekTo(if (duration > 0) t.coerceAtMost(duration) else t)
                                                  showHud("+10 s")
                                              } else {
                                                  togglePlay()
                                              }
                                          }
                                      }
                                  )
                              }
                              .pointerInput(locked) {
                                  var left = true
                                  detectVerticalDragGestures(
                                      onDragStart = { off -> left = off.x < size.width / 2f },
                                      onVerticalDrag = { change, dy ->
                                          if (!locked) {
                                              change.consume()
                                              val d = -dy / (size.height * 0.6f)
                                              if (left) {
                                                  brightness = (brightness + d).coerceIn(0.02f, 1f)
