                      hide(WindowInsetsCompat.Type.systemBars())
                  }

                  if (needLoad) {
                      val uris = PlayQueue.uris
                      val names = PlayQueue.names
                      val start = intent.getIntExtra("start", 0).coerceIn(0, uris.size - 1)
                      val items = uris.mapIndexed { i, u ->
                          MediaItem.Builder()
                              .setUri(u)
                              .setMediaMetadata(
                                  MediaMetadata.Builder().setTitle(names.getOrElse(i) { "" }).build()
                              )
                              .build()
                      }
                      val startId = PlayQueue.ids.getOrNull(start)
                      val saved = if (startId != null) sp.getLong("pos_$startId", 0L) else 0L
                      player.setMediaItems(items, start, saved)
                  }
                  applyModes(player)
                  PlayerHolder.setVideoEnabled(true)
                  if (needLoad) {
                      player.prepare()
                      player.playWhenReady = true
                  }

                  startService(Intent(this, PlaybackService::class.java))

                  if (Build.VERSION.SDK_INT >= 33 &&
