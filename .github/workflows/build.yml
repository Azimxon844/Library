          @Composable
          fun VideoTile(
              v: VideoItem,
              showFolder: Boolean,
              isFav: Boolean,
              actions: VideoActions,
              onClick: () -> Unit
          ) {
              Column(Modifier.clickable { onClick() }) {
                  Box {
                      Thumb(
                          v,
